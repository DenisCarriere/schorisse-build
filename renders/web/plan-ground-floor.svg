<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual ground-floor plan for the Belgian Brick Lantern</title>
  <desc id="desc">A seventeen by seven point five metre barn plan with one master bedroom, bathroom with Italian walk-in shower, powder room, courtyard entrance, stair, kitchen, dining and open living area facing the glass gable.</desc>
  <defs>
    <pattern id="tiles" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#b9b5ac" stroke-width="1"/>
    </pattern>
    <pattern id="wood" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 4H20M0 12H20" fill="none" stroke="#c5b6a2" stroke-width="1" opacity=".6"/>
    </pattern>
    <style>
      .bg{fill:#f4f0e7}.wall{fill:none;stroke:#1f1d19;stroke-width:24;stroke-linejoin:miter}.partition{fill:none;stroke:#38342e;stroke-width:8}.window{stroke:#386773;stroke-width:12;stroke-linecap:square}.glass{stroke:#386773;stroke-width:18}.door{fill:none;stroke:#8e4e2f;stroke-width:3}.dim{fill:none;stroke:#777168;stroke-width:1.5}.tick{stroke:#777168;stroke-width:1.5}.zone-master{fill:#e8ded1}.zone-service{fill:#dedbd2}.zone-living{fill:#e2e7de}.fixture{fill:none;stroke:#514c44;stroke-width:3}.furniture{fill:#d0c0aa;stroke:#514c44;stroke-width:3}.furniture-dark{fill:#625b51;stroke:#34312c;stroke-width:3}.label{font:700 18px Arial,sans-serif;letter-spacing:1.2px;fill:#211f1b}.sub{font:14px Arial,sans-serif;fill:#686158}.small{font:12px Arial,sans-serif;fill:#686158}.micro{font:700 10px Arial,sans-serif;letter-spacing:1px;fill:#8e4e2f}.dimension{font:13px Arial,sans-serif;fill:#686158}.title{font:700 34px Arial,sans-serif;fill:#1d1b18}.kicker{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#b4522e}.note{font:13px Arial,sans-serif;fill:#4f4a43}.accent{fill:#b4522e}.white{fill:#fff}.arrow{fill:none;stroke:#b4522e;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b4522e"/></marker>
  </defs>

  <rect class="bg" width="1400" height="850"/>
  <text class="kicker" x="76" y="62">CONCEPT PLAN · OPTION 01</text>
  <text class="title" x="76" y="105">Ground floor — daily living on one level</text>
  <text class="sub" x="76" y="132">External envelope 17.0 × 7.5 m · diagrammatic only · room sizes to measured design</text>

  <!-- overall dimensions -->
  <path class="dim" d="M120 175V150M1240 175V150M120 158H1240"/>
  <path class="tick" d="M120 151V165M1240 151V165"/>
  <text class="dimension" x="680" y="153" text-anchor="middle">17.0 m EXTERNAL</text>
  <path class="dim" d="M88 185H58M88 679H58M66 185V679"/>
  <path class="tick" d="M59 185H73M59 679H73"/>
  <text class="dimension" x="44" y="432" text-anchor="middle" transform="rotate(-90 44 432)">7.5 m EXTERNAL</text>

  <!-- orientation -->
  <text class="micro" x="142" y="171">REAR / COURTYARD GABLE</text>
  <text class="micro" x="1217" y="171" text-anchor="end">VALLEY / FULL GLASS GABLE</text>
  <text class="micro" x="680" y="171" text-anchor="middle">SHARED TRACTOR LANE</text>

  <!-- zone fills -->
  <rect class="zone-master" x="132" y="197" width="318" height="470"/>
  <rect class="zone-service" x="450" y="197" width="224" height="470"/>
  <rect class="zone-living" x="674" y="197" width="554" height="470"/>

  <!-- external and internal walls -->
  <rect class="wall" x="120" y="185" width="1120" height="494"/>
  <path class="partition" d="M450 197V408M450 492V667"/>
  <path class="partition" d="M450 408H620M450 492H550M620 197V338M620 408V492M550 492V667"/>
  <path class="partition" d="M450 568H550"/>

  <!-- exterior windows: blue -->
  <path class="window" d="M195 185H275M320 185H400"/>
  <path class="window" d="M120 285V360M120 450V525"/>
  <path class="window" d="M700 185H748"/>
  <path class="window" d="M865 185H1045"/>
  <path class="window" d="M255 679H345M755 679H835"/>
  <path class="glass" d="M1240 213V651"/>

  <!-- courtyard entrance and internal doors -->
  <rect x="585" y="661" width="74" height="22" fill="#7a5138"/>
  <path class="door" d="M585 659V585A74 74 0 0 1 659 659"/>
  <text class="micro" x="622" y="711" text-anchor="middle">OAK ENTRANCE</text>
  <path class="door" d="M450 408H390A60 60 0 0 0 450 468"/>
  <path class="door" d="M620 408V350A58 58 0 0 0 562 408"/>
  <path class="door" d="M550 520H500A50 50 0 0 1 550 570"/>

  <!-- master bedroom furniture -->
  <rect x="190" y="296" width="185" height="235" rx="5" fill="url(#wood)" stroke="#514c44" stroke-width="3"/>
  <rect class="furniture" x="205" y="312" width="73" height="42" rx="9"/>
  <rect class="furniture" x="286" y="312" width="73" height="42" rx="9"/>
  <path class="fixture" d="M282 356V516"/>
  <rect class="furniture-dark" x="383" y="240" width="40" height="170" rx="2"/>
  <path class="fixture" d="M390 252H416M390 276H416M390 300H416M390 324H416M390 348H416M390 372H416"/>
  <circle class="furniture" cx="403" cy="488" r="25"/>
  <text class="label" x="284" y="578" text-anchor="middle">MASTER BEDROOM</text>
  <text class="sub" x="284" y="601" text-anchor="middle">sleeping + full-height wardrobes</text>
  <text class="small" x="284" y="622" text-anchor="middle">approximately 25–28 m²</text>

  <!-- main bathroom -->
  <rect x="462" y="209" width="146" height="186" fill="url(#tiles)"/>
  <rect class="fixture" x="472" y="221" width="124" height="83" rx="2"/>
  <path d="M482 304H586" stroke="#386773" stroke-width="4"/>
  <circle cx="492" cy="236" r="5" fill="#386773"/>
  <path class="fixture" d="M485 245c25 18 53 18 78 0"/>
  <rect class="fixture" x="470" y="327" width="110" height="42" rx="4"/>
  <circle class="fixture" cx="497" cy="348" r="10"/><circle class="fixture" cx="553" cy="348" r="10"/>
  <text class="label" x="535" y="383" text-anchor="middle">BATHROOM</text>
  <text class="small" x="535" y="251" text-anchor="middle">ITALIAN WALK-IN SHOWER</text>
  <text class="small" x="535" y="269" text-anchor="middle">flush floor · fixed screen</text>

  <!-- powder room -->
  <rect x="462" y="504" width="76" height="52" fill="url(#tiles)"/>
  <ellipse class="fixture" cx="484" cy="532" rx="13" ry="17"/>
  <rect class="fixture" x="508" y="513" width="20" height="16" rx="3"/>
  <text class="micro" x="500" y="586" text-anchor="middle">POWDER</text>
  <text class="small" x="500" y="604" text-anchor="middle">toilet + sink only</text>

  <!-- entry / storage -->
  <rect class="furniture-dark" x="562" y="505" width="42" height="120" rx="2"/>
  <path class="fixture" d="M570 520H596M570 544H596M570 568H596M570 592H596"/>
  <text class="micro" x="614" y="538">COATS</text>
  <text class="micro" x="614" y="556">+ TECH</text>
  <text class="label" x="565" y="454" text-anchor="middle">ENTRY HALL</text>
  <text class="small" x="565" y="475" text-anchor="middle">direct sightline to glass gable</text>

  <!-- stair aligned to tall exterior window -->
  <rect x="630" y="209" width="188" height="119" fill="#d6cec0" stroke="#514c44" stroke-width="3"/>
  <path class="fixture" d="M648 221V316M669 221V316M690 221V316M711 221V316M732 221V316M753 221V316M774 221V316M795 221V316"/>
  <path class="arrow" d="M648 309H795"/>
  <text class="micro" x="724" y="348" text-anchor="middle">STAIR UP</text>

  <!-- kitchen -->
  <rect class="furniture-dark" x="842" y="215" width="226" height="58" rx="2"/>
  <circle cx="880" cy="244" r="13" fill="none" stroke="#ddd5ca" stroke-width="2"/>
  <circle cx="918" cy="244" r="13" fill="none" stroke="#ddd5ca" stroke-width="2"/>
  <rect x="990" y="229" width="52" height="28" rx="3" fill="none" stroke="#ddd5ca" stroke-width="2"/>
  <rect class="furniture-dark" x="790" y="326" width="238" height="70" rx="3"/>
  <circle class="furniture" cx="835" cy="420" r="18"/>
  <circle class="furniture" cx="890" cy="420" r="18"/>
  <circle class="furniture" cx="945" cy="420" r="18"/>
  <text class="label" x="930" y="301" text-anchor="middle">KITCHEN</text>
  <text class="sub" x="930" y="319" text-anchor="middle">picture window + island</text>

  <!-- dining -->
  <rect class="furniture" x="1000" y="458" width="145" height="68" rx="28"/>
  <circle class="furniture" cx="1025" cy="444" r="13"/><circle class="furniture" cx="1073" cy="444" r="13"/><circle class="furniture" cx="1121" cy="444" r="13"/>
  <circle class="furniture" cx="1025" cy="540" r="13"/><circle class="furniture" cx="1073" cy="540" r="13"/><circle class="furniture" cx="1121" cy="540" r="13"/>
  <text class="micro" x="1073" y="568" text-anchor="middle">DINING</text>

  <!-- living -->
  <path class="furniture" d="M1088 284h104v55h-64v72h-40z"/>
  <rect class="furniture" x="1040" y="338" width="84" height="48" rx="18"/>
  <rect class="furniture-dark" x="1172" y="462" width="32" height="100" rx="14"/>
  <text class="label" x="1136" y="605" text-anchor="middle">OPEN LIVING</text>
  <text class="small" x="1136" y="625" text-anchor="middle">double-height · valley-facing</text>

  <!-- plan callouts -->
  <path class="arrow" d="M1305 432H1256"/>
  <text class="micro" x="1312" y="407" text-anchor="end">UNOBSTRUCTED</text>
  <text class="micro" x="1312" y="424" text-anchor="end">GLASS GABLE</text>
  <text class="micro" x="680" y="741" text-anchor="middle">COURTYARD / COBBLED ARRIVAL</text>

  <!-- segment dimensions -->
  <path class="dim" d="M120 770V746M450 770V746M674 770V746M1240 770V746M120 758H1240"/>
  <text class="dimension" x="285" y="790" text-anchor="middle">5.0 m PRIVATE</text>
  <text class="dimension" x="562" y="790" text-anchor="middle">3.4 m SERVICE / ENTRY</text>
  <text class="dimension" x="957" y="790" text-anchor="middle">8.6 m OPEN LIVING</text>
  <text class="note" x="76" y="828">Concept only — verify wall build-up, accessibility, structure, stair, fire strategy, services and all room dimensions with the architect.</text>
</svg>
